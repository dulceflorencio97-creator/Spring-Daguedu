app.jwt.secret=${JWT_SECRET:miSecretoSuperSecretoJWT2026QueDebeTenerMasDe32Caracteres!}
app.jwt.expiration-ms=86400000
stripe.apikey.secret=${STRIPE_API_KEY:}
